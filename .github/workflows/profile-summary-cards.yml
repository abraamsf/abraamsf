name: GitHub Profile Summary Cards

on:
  schedule:
    # Jalan otomatis tiap hari pukul 01:00 UTC (08:00 WIB)
    - cron: "0 1 * * *"
  # Bisa juga dijalankan manual dari tab "Actions" → tombol "Run workflow"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-summary-cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          # Branch tujuan tempat kartu SVG disimpan (samakan dengan branch utama repo)
          BRANCH_NAME: "main"
          # Zona waktu untuk kartu "productive time" → 7 = WIB (Indonesia)
          UTC_OFFSET: 7
